name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build -A x64 -DNSO_ENABLE_DISCORD=OFF -DNSO_STATIC_RUNTIME=ON
      - run: cmake --build build --config Release --parallel
      - shell: pwsh
        run: |
          $test = Start-Process build/Release/CaptureDock.exe -ArgumentList '--self-test' -Wait -PassThru
          exit $test.ExitCode
